name: Fork&Patch OldTeaBag

run-name: "${{ inputs.target_branch }} ← ${{ inputs.upstream_branch }}${{ inputs.description && format(' | {0}', inputs.description) || '' }}"

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: '上游仓库 (kaedelcb) 的分支名'
        required: true
        default: 'main-OldTeaBag-B184'
        type: string
      target_branch:
        description: '推送到本仓库 (bcmdy) 的目标分支名'
        required: true
        default: 'LCB-66.3-lcb.23.0-NBGI-fix3-DF4.3'
        type: string
      patch_file:
        description: '补丁文件路径（相对本仓库根目录）'
        required: true
        default: '.github/patches/0001-DF4.3.patch'
        type: string
      description:
        description: '运行描述（可选，会显示在运行标题里）'
        required: false
        default: '自动同步补丁'
        type: string

permissions:
  contents: write # 必须授予写权限，才能将提交推送到本仓库

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    steps:
      # 0. 先检出本仓库（仅为获取补丁文件），放到 local-repo 子目录
      - name: Checkout Local Repo (for patch)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: local-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. 拉取上游仓库 (kaedelcb) 的指定分支，放到 upstream-repo 子目录
      - name: Checkout Upstream Branch
        uses: actions/checkout@v4
        with:
          repository: 'kaedelcb/better-genshin-impact'
          ref: ${{ inputs.upstream_branch }}
          fetch-depth: 0
          path: upstream-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 应用位于本仓库脚本路径下的补丁文件
      - name: Apply Patch
        working-directory: upstream-repo
        run: |
          PATCH_FILE="../local-repo/${{ inputs.patch_file }}"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "❌ 错误: 补丁文件 $PATCH_FILE 不存在。请先创建补丁文件。"
            exit 1
          fi

          # 使用 --3way 进行三方合并，能更好地处理上下文偏移
          if git apply --3way --verbose "$PATCH_FILE"; then
            echo "✅ 补丁应用成功。"
          else
            echo "❌ 补丁应用失败，请检查补丁内容是否与上游分支兼容。"
            exit 1
          fi

      # 3. 配置 Git 用户信息（用于提交记录）
      - name: Configure Git
        working-directory: upstream-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 4. 提交补丁带来的更改
      - name: Commit Changes
        working-directory: upstream-repo
        run: |
          git add -A
          # 如果补丁没有产生任何文件变化，则跳过提交
          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交。"
          else
            git commit -m "自动补丁DF4.3至${{ inputs.upstream_branch }}"
          fi

      # 5. 将结果推送到本仓库 (bcmdy) 的目标分支
      - name: Push to Destination
        working-directory: upstream-repo
        run: |
          # 设置推送的目标 URL，包含 GITHUB_TOKEN 用于认证
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/${{ inputs.target_branch }}